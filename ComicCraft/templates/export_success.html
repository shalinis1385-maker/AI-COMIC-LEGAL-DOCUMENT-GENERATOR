{% extends "base.html" %}
{% block title %}Export Complete — ComicCraft{% endblock %}
{% block content %}
<section class="card success-card">
    <div class="success-icon">✓</div>
    <span class="eyebrow">EXPORT COMPLETE</span>
    <h1>Your comic is ready.</h1>
    <p>The PDF has been generated successfully.</p>
    {% if pdf_url %}
    <a class="button primary" href="{{ pdf_url }}" download>Download PDF</a>
    {% endif %}
    <a class="button secondary" href="/">Go Create Another Comic</a>
</section>
{% endblock %}
